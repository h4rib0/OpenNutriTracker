name: Default Workflow
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
jobs:
  linux-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.7
          channel: stable
          cache: true

      - name: Setup Just
        uses: taiki-e/install-action@just

      - name: Cache Flutter packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-cache-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-cache-

      # The envied package obfuscates `.env` values into env.g.dart at compile
      # time. CI doesn't have access to the real secrets and the test suite
      # never hits Sentry / Supabase / FDC at runtime, so we stub them. Real
      # values must come from a developer's local .env when building for
      # release.
      - name: Generate stub .env for CI
        run: |
          cat > .env <<'EOF'
          FDC_API_KEY="ci-stub"
          SENTRY_DNS="https://stub@sentry.io/0"
          SUPABASE_PROJECT_URL="https://stub.supabase.co"
          SUPABASE_PROJECT_ANON_KEY="ci-stub"
          EOF
      - name: Install Flutter packages
        run: just install
      - name: Verify generated intl files
        run: just check_intl
      - name: Generate code (env.g.dart, Hive adapters, JSON serializers)
        run: just build
      - name: Static analysis
        run: flutter analyze
      - name: Run tests
        run: just test
      - name: Test the iOS pod-install fallback parser
        run: ".github/scripts/test_pod_install_with_targeted_fallback.sh"

  ios-build:
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: "${{ github.event.pull_request.head.ref || github.ref }}"
          repository:
            "${{ github.event.pull_request.head.repo.full_name || github.repository
            }}"
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.7
          channel: stable
          cache: true

      - name: Cache Flutter packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-cache-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-cache-

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Generate stub .env for CI
        run: |
          cat > .env <<'EOF'
          FDC_API_KEY="ci-stub"
          SENTRY_DNS="https://stub@sentry.io/0"
          SUPABASE_PROJECT_URL="https://stub.supabase.co"
          SUPABASE_PROJECT_ANON_KEY="ci-stub"
          EOF

      - name: Install Flutter packages
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Pod install (regenerate lockfile if constraints have shifted)
        run: ".github/scripts/pod_install_with_targeted_fallback.sh"

      - name: Auto-commit refreshed Podfile.lock
        if:
          github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name
          == github.repository
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          file_pattern: ios/Podfile.lock
          commit_message: "chore(ios): refresh Podfile.lock via CI"

      - name: Upload Podfile.lock artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-podfile-lock
          path: ios/Podfile.lock

      - name: Build iOS (no codesign)
        run: flutter build ios --no-codesign --release

  ios-integration-tests:
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.7
          channel: stable
          cache: true

      - name: Cache Flutter packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-cache-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-cache-

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Generate stub .env for CI
        run: |
          cat > .env <<'EOF'
          FDC_API_KEY="ci-stub"
          SENTRY_DNS="https://stub@sentry.io/0"
          SUPABASE_PROJECT_URL="https://stub.supabase.co"
          SUPABASE_PROJECT_ANON_KEY="ci-stub"
          EOF

      - name: Install Flutter packages
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Pod install (regenerate lockfile if constraints have shifted)
        run: ".github/scripts/pod_install_with_targeted_fallback.sh"

      - name: Pick + boot iPhone simulator
        run: |
          DEVICE_UDID=$(xcrun simctl list devices available iPhone -j | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          devices = [d for runtime in data['devices'].values() for d in runtime if d.get('isAvailable')]
          if not devices:
              sys.exit('No available iPhone simulators on this runner')
          print(devices[0]['udid'])
          ")
          echo "Booting simulator UDID: $DEVICE_UDID"
          xcrun simctl boot "$DEVICE_UDID"
          xcrun simctl bootstatus "$DEVICE_UDID"
          echo "DEVICE_UDID=$DEVICE_UDID" >> $GITHUB_ENV

      - name: Run integration tests
        run: flutter test integration_test/ -d "$DEVICE_UDID" --reporter expanded

  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.7
          channel: stable
          cache: true

      - name: Cache Flutter packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-cache-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-cache-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Generate stub .env for CI
        run: |
          cat > .env <<'EOF'
          FDC_API_KEY="ci-stub"
          SENTRY_DNS="https://stub@sentry.io/0"
          SUPABASE_PROJECT_URL="https://stub.supabase.co"
          SUPABASE_PROJECT_ANON_KEY="ci-stub"
          EOF

      - name: Install Flutter packages
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build APK (debug)
        run: flutter build apk --debug

  android-integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.7
          channel: stable
          cache: true

      - name: Cache Flutter packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-cache-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-cache-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Cache the AVD snapshot so future runs skip the slow first-boot.
      # Key includes the API level so a bump invalidates the cache.
      - name: Cache AVD
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-android-34

      - name: Enable KVM (so the Android emulator runs at native speed)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Generate stub .env for CI
        run: |
          cat > .env <<'EOF'
          FDC_API_KEY="ci-stub"
          SENTRY_DNS="https://stub@sentry.io/0"
          SUPABASE_PROJECT_URL="https://stub.supabase.co"
          SUPABASE_PROJECT_ANON_KEY="ci-stub"
          EOF

      - name: Install Flutter packages
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Generate AVD snapshot (cache miss only)
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options:
            "-no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none"
          disable-animations: false
          script: echo "AVD snapshot generated for cache"
      - name: Run integration tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: "-no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none"
          disable-animations: true
          script: flutter test integration_test/ --reporter expanded

  ios-deploy-condensed:
    needs: ios-integration-tests
    runs-on: macos-latest
    if: "${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.event_name == 'workflow_dispatch' }}"
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Determine fastlane lane
        run: |
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then echo "FASTLANE_LANE=release" >> $GITHUB_ENV
          elif [ "${GITHUB_REF}" = "refs/heads/develop" ]; then echo "FASTLANE_LANE=beta" >> $GITHUB_ENV
          else echo "FASTLANE_LANE=release" >> $GITHUB_ENV
          fi
      - name: Inject native build secrets (.env, iOS certs)
        run: |
          cat > .env <<'EOT'
          FDC_API_KEY="${{ secrets.FDC_API_KEY }}"
          SENTRY_DNS="${{ secrets.SENTRY_DNS }}"
          SUPABASE_PROJECT_URL="${{ secrets.SUPABASE_PROJECT_URL }}"
          SUPABASE_PROJECT_ANON_KEY="${{ secrets.SUPABASE_PROJECT_ANON_KEY }}"
          EOT
          if [ -n "${{ secrets.IOS_CERTS_P12 }}" ]; then
            echo "${{ secrets.IOS_CERTS_P12 }}" | base64 --decode > ios/certs.p12
          fi
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
      - name: Install Bundler and gems
        run: |
          cd ios
          gem install bundler --conservative || true
          bundle config path vendor/bundle || true
          bundle install --jobs 4 --retry 3
      - name: Create App Store Connect API key file (if provided)
        if: "${{ secrets.APP_STORE_CONNECT_API_KEY != '' }}"
        run: 'echo "${{ secrets.APP_STORE_CONNECT_API_KEY }}" > ios/appstore_api_key.json'
      - name: Run fastlane (iOS)
        env:
          FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD: "${{ secrets.FASTLANE_APP_SPECIFIC_PASSWORD}}"
          APP_STORE_CONNECT_API_KEY_PATH: ios/appstore_api_key.json
          MATCH_GIT_URL: "${{ secrets.MATCH_GIT_URL }}"
          MATCH_PASSWORD: "${{ secrets.MATCH_PASSWORD }}"
        run: |
          cd ios
          bundle exec fastlane $FASTLANE_LANE

  android-deploy-condensed:
    needs: android-integration-tests
    runs-on: ubuntu-latest
    if: "${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.event_name == 'workflow_dispatch' }}"
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Determine fastlane lane
        run: |
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then echo "FASTLANE_LANE=deploy" >> $GITHUB_ENV
          elif [ "${GITHUB_REF}" = "refs/heads/develop" ]; then echo "FASTLANE_LANE=internal" >> $GITHUB_ENV
          else echo "FASTLANE_LANE=deploy" >> $GITHUB_ENV
          fi
      - name: Inject native build secrets (.env) and decode keystore
        run: |
          cat > .env <<'EOT'
          FDC_API_KEY="${{ secrets.FDC_API_KEY }}"
          SENTRY_DNS="${{ secrets.SENTRY_DNS }}"
          SUPABASE_PROJECT_URL="${{ secrets.SUPABASE_PROJECT_URL }}"
          SUPABASE_PROJECT_ANON_KEY="${{ secrets.SUPABASE_PROJECT_ANON_KEY }}"
          EOT
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/keystore.jks
            cd android
            echo "storeFile=keystore.jks" > keystore.properties
            echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> keystore.properties
            echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" >> keystore.properties
            echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}" >> keystore.properties
          fi
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.7
          channel: stable
          cache: true
      - name: Install Bundler and gems
        run: |
          cd android
          gem install bundler --conservative || true
          bundle config path vendor/bundle || true
          bundle install --jobs 4 --retry 3
      - name: Create Google Play service account JSON (if provided)
        if: "${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON != '' }}"
        run: 'echo "${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}" > android/play_store_key.json'
      - name: Run fastlane (Android)
        env:
          SUPPLY_JSON_KEY: android/play_store_key.json
          ANDROID_KEYSTORE: android/keystore.jks
          ANDROID_KEYSTORE_PASSWORD: "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
          ANDROID_KEY_ALIAS: "${{ secrets.ANDROID_KEY_ALIAS }}"
          ANDROID_KEY_PASSWORD: "${{ secrets.ANDROID_KEY_PASSWORD }}"
        run: |
          cd android
          bundle exec fastlane $FASTLANE_LANE
